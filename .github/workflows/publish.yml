name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Omit registry-url so setup-node does not write an .npmrc with NODE_AUTH_TOKEN
          # that would shadow the OIDC trusted publishing identity.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        # Trusted publishing needs npm CLI >= 11.5.1; Node 22 bundles npm 10.x.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION, package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run verification
        run: |
          npm run check
          npm pack --dry-run --ignore-scripts

      # Authentication uses the workflow's OIDC identity (npm trusted publishing);
      # provenance is generated automatically for public packages.
      - name: Publish paseo-dictation-polish
        run: npm publish --access public
